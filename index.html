<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jay Magayanes | Data, Support and Automation</title>
<meta name="theme-color" content="#1B4DDB">
<meta property="og:title" content="Jay Magayanes | Data, Support and Automation">
<meta property="og:description" content="Eight years in customer support, technical support and data work, and I like building small tools that make that work easier.">
<meta property="og:type" content="website">

<meta name="description" content="I'm Jay, based in the Philippines. I've spent eight years in customer support, technical support and data work, and I enjoy building small tools that make that work easier. Open a section to see what I've made.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F7F9;
    --surface: #FFFFFF;
    --ink: #16202C;
    --muted: #556070;
    --line: #DCE1E8;
    --accent: #1B4DDB;
    --accent-ink: #FFFFFF;
    --soft: #E8EEFC;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F151D;
      --surface: #151D28;
      --ink: #E8ECF2;
      --muted: #9AA6B5;
      --line: #263141;
      --accent: #7FA0FF;
      --accent-ink: #0F151D;
      --soft: #1A2640;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
  .wrap {
    max-width: 1080px; margin: 0 auto; position: relative; z-index: 1;
    padding: 0 max(1.5rem, env(safe-area-inset-right)) 0 max(1.5rem, env(safe-area-inset-left));
  }
  .about-text p, .detail .sum, .detail li { text-wrap: pretty; }
  h1, h2, h3, .hero .headline { text-wrap: balance; }

  /* Hero */
  .hero { padding: 3rem 0 0.75rem; display: grid; gap: 1.25rem 2.5rem; }
  @media (min-width: 900px) {
    .hero { grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
    .hero .connect { padding-top: 0.4rem; }
  }
  .hero h1 { font-family: var(--body); font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 600; }
  .hero h1 { color: var(--accent); }
  .name-text { display: inline-block; }

  /* The headline's loop animation is driven by JS: see "Looping variations" below */
  .hero .headline {
    font-family: var(--display); font-weight: 500; color: var(--muted);
    font-size: clamp(1.1rem, 2.2vw, 1.5rem); margin: 0.6rem 0 0; letter-spacing: -0.01em; line-height: 1.35;
  }
  /* Availability line under the name */
  .availability { margin: 0.45rem 0 0; display: flex; align-items: center; gap: 0.55rem; font-size: 0.95rem; color: var(--muted); }
  .availability::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; }

  /* Actions (About me + résumé) with Let's connect underneath */
  .connect { display: flex; flex-direction: column; align-items: flex-start; gap: 0.7rem; }
  .connect .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .connect .about-link, .connect .resume {
    font: inherit; font-weight: 700; font-size: 1rem; line-height: 1.4; border-radius: 8px; margin: 0;
    padding: 0.7rem 1.2rem; cursor: pointer; white-space: nowrap; text-decoration: none;
    display: inline-flex; align-items: center;
  }
  .connect .about-link { color: var(--accent-ink); background: var(--accent); border: 0; }
  .connect .about-link:hover { filter: brightness(1.1); }
  .connect .resume { color: var(--accent); background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
  @media (hover: hover) { .connect .resume:hover { background: var(--soft); } }
  .connect .reach { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.1rem 1rem; }
  .connect .lets { margin: 0; font-weight: 600; font-size: 1.05rem; color: var(--ink); }
  .connect .links { display: flex; flex-wrap: wrap; gap: 0.1rem 1.1rem; }
  .connect .links a { font-weight: 500; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; padding: 0.2rem 0; }

  /* Social buttons (inside the About me pop-up) */
  .c-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.6rem; margin-top: 1.5rem; }
  .reach-note { margin: 1rem 0 0; font-size: 1rem; color: var(--muted); }
  @media (max-width: 760px) { .c-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 460px) { .c-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .c-item {
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    padding: 0.9rem 0.4rem; border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); text-decoration: none; font-weight: 600; font-size: 0.9rem; text-align: center;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .c-item:hover, .c-item:focus-visible { background: var(--soft); border-color: var(--accent); }
  .c-ico {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, currentColor 13%, transparent);
  }

  /* Tile mesh: tiles share hairline borders */
  .mesh {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  @media (min-width: 620px) {
    .mesh { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 0; }
  }
  @media (min-width: 900px) {
    .mesh { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .tile, .tile:last-child:nth-child(odd) { grid-column: span 2; min-height: 190px; }
    .tile.wide { grid-column: span 3; }
  }
  .tile {
    font: inherit; color: inherit; text-align: left;
    background: var(--surface);
    border: 0; margin: 0;
    padding: 1.4rem 1.4rem 1.1rem;
    min-height: 190px;
    display: flex; flex-direction: column; gap: 0.5rem;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  @media (hover: hover) { .tile:hover { background: var(--soft); } }
  .tile:focus-visible { outline-offset: -4px; }
  .tile h2 { font-size: 1.55rem; font-weight: 700; }
  @media (hover: hover) { .tile:hover h2 { color: var(--accent); } }
  .tile .blurb { color: var(--muted); margin: 0; }
  .tile .chips { margin: 0; font-size: 0.9rem; }
  .tile .foot {
    margin-top: auto; display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 0.9rem;
  }
  .tile .more {
    display: inline-flex; align-items: center; gap: 0.5rem;
    color: var(--accent); font-weight: 600; font-size: 0.95rem;
  }
  .tile .more .arrow {
    width: 0; height: 0;
    border-left: 7px solid currentColor;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    transition: transform 0.2s;
  }
  @media (hover: hover) { .tile:hover .more .arrow { transform: translateX(4px); } }

  /* Hovered tile: a soft sheen sweeps across while a faint water shade drifts underneath */
  .tile { position: relative; overflow: hidden; isolation: isolate; }
  .tile > * { position: relative; z-index: 1; }
  .tile::before, .tile::after {
    content: ""; position: absolute; pointer-events: none; z-index: 0;
    opacity: 0; transition: opacity 0.35s;
  }
  .tile::before {
    inset: 0;
    background: linear-gradient(115deg, transparent 35%, color-mix(in srgb, var(--accent) 16%, transparent) 50%, transparent 65%);
    background-size: 300% 100%; background-position: 120% 0;
  }
  .tile::after {
    inset: -30%;
    background:
      radial-gradient(closest-side at 25% 70%, color-mix(in srgb, var(--accent) 14%, transparent), transparent),
      radial-gradient(closest-side at 75% 30%, color-mix(in srgb, var(--accent) 10%, transparent), transparent);
  }
  .tile:focus-visible::before { opacity: 1; animation: sheen 2.6s ease-in-out infinite; }
  .tile:focus-visible::after { opacity: 1; animation: drift 5s ease-in-out infinite alternate; }
  @media (hover: hover) {
    .tile:hover::before { opacity: 1; animation: sheen 2.6s ease-in-out infinite; }
    .tile:hover::after { opacity: 1; animation: drift 5s ease-in-out infinite alternate; }
  }
  @keyframes sheen { from { background-position: 120% 0; } to { background-position: -20% 0; } }
  @keyframes drift { from { transform: translate(-5%, -3%) rotate(0deg); } to { transform: translate(5%, 4%) rotate(6deg); } }

  footer { padding: 1.25rem 0 2rem; color: var(--muted); font-size: 0.875rem; }

  /* Pop-up */
  dialog { color: var(--ink); }
  dialog.modal {
    width: min(1320px, calc(100% - 3rem));
    height: min(93vh, 940px);
    height: min(93dvh, 940px);
    padding: 0; margin: auto;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
  }
  dialog.modal[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(8, 14, 22, 0.6); }
  .m-head {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding: 1.2rem 2rem; border-bottom: 1px solid var(--line);
  }
  .m-head h2 { font-size: 1.85rem; font-weight: 700; }
  .m-actions { display: flex; align-items: center; gap: 0.6rem; flex: none; }
  .copy {
    font: inherit; font-size: 0.9rem; font-weight: 600; height: 2.25rem; padding: 0 0.85rem; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--accent); cursor: pointer; white-space: nowrap;
  }
  .copy:hover { background: var(--soft); }
  .x {
    font: inherit; font-size: 1.4rem; line-height: 1;
    width: 2.25rem; height: 2.25rem; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .x:hover { background: var(--soft); }
  .m-body { flex: 1; min-height: 0; overflow-y: auto; display: block; overscroll-behavior: contain; }
  @media (min-width: 860px) {
    .m-body { display: grid; grid-template-columns: 360px minmax(0, 1fr); overflow: hidden; }
    .pane { overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
    .pane.left { border-right: 1px solid var(--line); }
  }
  .pane { padding: 2rem 2.25rem; }
  .pane .summary { margin: 0 0 1.5rem; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
  dl.skills { margin: 0 0 2rem; }
  dl.skills dt { font-weight: 600; margin-top: 1.1rem; }
  dl.skills dd { margin: 0.25rem 0 0; color: var(--muted); font-size: 1rem; line-height: 1.6; }
  .list-title { font-family: var(--display); font-size: 1.15rem; font-weight: 700; margin: 0 0 0.75rem; }
  .proj-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .proj-btn {
    font: inherit; text-align: left; color: var(--ink);
    padding: 0.85rem 1rem; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; cursor: pointer;
    display: flex; justify-content: space-between; gap: 0.75rem; align-items: baseline;
  }
  .proj-btn:hover { background: var(--soft); }
  .proj-btn[aria-current="true"] { border-color: var(--accent); background: var(--soft); font-weight: 600; }
  .proj-btn small { color: var(--muted); font-weight: 400; white-space: nowrap; }

  /* Gallery */
  .stage {
    position: relative; aspect-ratio: 16 / 9;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; display: grid; place-items: center;
  }
  .stage img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; display: block; }
  .stage iframe { width: 100%; height: 100%; border: 0; display: block; }
  .stage .empty { color: var(--muted); text-align: center; padding: 1rem; max-width: 34ch; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 2.25rem; height: 2.25rem; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 1.1rem; cursor: pointer;
  }
  .nav:hover { background: var(--soft); }
  .nav.prev { left: 0.6rem; } .nav.next { right: 0.6rem; }
  .caption { margin: 0.75rem 0 0; color: var(--muted); font-size: 0.9rem; min-height: 1.4em; }
  .thumbs { display: flex; gap: 0.6rem; margin-top: 0.75rem; overflow-x: auto; padding-bottom: 0.25rem; }
  .thumb {
    flex: 0 0 auto; padding: 0; width: 76px; height: 50px;
    border: 2px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb[aria-current="true"] { border-color: var(--accent); }

  .detail h3 { font-size: 1.95rem; font-weight: 700; display: flex; flex-wrap: wrap; gap: 0.4rem 0.75rem; align-items: center; margin-top: 2rem; }
  .status {
    font-family: var(--body); font-size: 0.8rem; font-weight: 600; letter-spacing: 0;
    padding: 0.1rem 0.6rem; border-radius: 99px; background: var(--soft); color: var(--accent);
  }
  .status.soon { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
  .detail .sum { margin: 0.9rem 0 0; font-size: 1.1rem; line-height: 1.6; }
  .detail .stack { margin: 0.75rem 0 0; color: var(--muted); font-size: 1rem; }
  .detail ul { margin: 1.25rem 0 0; padding-left: 1.3rem; color: var(--muted); font-size: 1.02rem; line-height: 1.6; }
  .detail li { margin: 0.55rem 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.75rem; align-items: center; }
  .btn {
    font: inherit; font-weight: 600; font-size: 0.95rem;
    padding: 0.55rem 1rem; border-radius: 6px;
    border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink);
    text-decoration: none; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.quiet { background: transparent; color: var(--accent); }
  .btn.quiet:hover { background: var(--soft); filter: none; }
  .pending { color: var(--muted); font-size: 0.95rem; }

  /* Background water-shade canvas */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  /* Headline types out (the name is static) */
  .word { display: inline-block; white-space: nowrap; }
  .tw { opacity: 0; }
  .tw.on { opacity: 1; }
  .caret {
    display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -0.12em;
    background: var(--accent); animation: caretBlink 0.8s steps(1) infinite;
  }
  .caret.gone { opacity: 0; animation: none; transition: opacity 0.4s; }
  @keyframes caretBlink { 50% { opacity: 0; } }

  /* Pets */
  .mesh-wrap { position: relative; }
  .peek-cat, .footer-dog { position: absolute; z-index: 3; cursor: pointer; line-height: 0; }
  .peek-cat { right: 7%; top: -52px; width: 64px; animation: peekbob 4s ease-in-out infinite; }
  @keyframes peekbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  footer { position: relative; padding-right: 5rem; }
  .footer-dog { right: 1rem; top: 6px; width: 54px; }
  .bubble {
    position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, 4px);
    background: var(--ink); color: var(--bg); font: 600 0.8rem/1 var(--body);
    padding: 0.35rem 0.6rem; border-radius: 99px; white-space: nowrap;
    opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none;
  }
  .peek-cat:hover .bubble, .footer-dog:hover .bubble { opacity: 1; transform: translate(-50%, -2px); }
  @media (max-width: 620px) { .peek-cat { width: 52px; top: -42px; } }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; animation-delay: var(--d, 0s); }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  .ear-l, .ear-r { transform-box: fill-box; animation: twitch 8s infinite; animation-delay: var(--d, 0s); }
  .ear-l { transform-origin: 85% 90%; }
  .ear-r { transform-origin: 15% 90%; animation-name: twitchR; }
  @keyframes twitch  { 0%, 90%, 100% { transform: none; } 93% { transform: rotate(-14deg); } 96% { transform: rotate(3deg); } }
  @keyframes twitchR { 0%, 90%, 100% { transform: none; } 93% { transform: rotate(14deg); } 96% { transform: rotate(-3deg); } }
  .dear-l, .dear-r { transform-box: fill-box; animation: flop 2.6s ease-in-out infinite alternate; }
  .dear-l { transform-origin: 80% 0; }
  .dear-r { transform-origin: 20% 0; animation-direction: alternate-reverse; }
  @keyframes flop { from { transform: rotate(-5deg); } to { transform: rotate(4deg); } }
  .tongue { transform-box: fill-box; transform-origin: top center; animation: pant 0.55s ease-in-out infinite alternate; }
  @keyframes pant { from { transform: scaleY(0.75); } to { transform: scaleY(1.15); } }

  .pets { display: flex; flex-wrap: wrap; gap: 0.35rem 0.5rem; margin-top: 1.5rem; align-items: flex-end; }
  .pet { display: inline-block; line-height: 0; cursor: pointer; }
  .pet:hover { animation: hop 0.45s ease-out; }
  @keyframes hop { 40% { transform: translateY(-10px) rotate(-4deg); } 100% { transform: none; } }

  /* Pets that stroll across the bottom of the screen now and then */
  .walker { position: fixed; bottom: 4px; left: 0; z-index: 2; pointer-events: none; width: 96px; line-height: 0; will-change: transform; }
  .walker svg { animation: bob 0.5s ease-in-out infinite alternate; }
  .walker .flip { display: block; }
  .walker-cat { animation: crossR 85s linear 6s infinite backwards; }
  .walker-dog { animation: crossL 120s linear 38s infinite backwards; }
  .walker-dog .flip { transform: scaleX(-1); }
  @keyframes crossR { 0% { transform: translateX(-140px); } 26% { transform: translateX(calc(100vw + 140px)); } 100% { transform: translateX(calc(100vw + 140px)); } }
  @keyframes crossL { 0% { transform: translateX(calc(100vw + 140px)); } 28% { transform: translateX(-140px); } 100% { transform: translateX(-140px); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  .leg { transform-box: fill-box; transform-origin: top center; animation: step 0.5s ease-in-out infinite alternate; }
  .leg.b { animation-direction: alternate-reverse; }
  @keyframes step { from { transform: rotate(-26deg); } to { transform: rotate(26deg); } }
  .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: wag 0.7s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(14deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .walker, #fx { display: none; }
    .tw { opacity: 1 !important; transform: none !important; filter: none !important; }
    .caret { display: none; }
  }

  /* Draggable header and resize handles */
  .m-head { cursor: move; touch-action: none; user-select: none; }
  .m-head .x, .m-head .copy { cursor: pointer; }
  .rs { position: absolute; z-index: 5; touch-action: none; }
  .rs-n  { top: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
  .rs-s  { bottom: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
  .rs-e  { right: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
  .rs-w  { left: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
  .rs-ne { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; }
  .rs-sw { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; }
  .rs-nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  .rs-se {
    bottom: 0; right: 0; width: 16px; height: 16px; cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 0 52%, var(--muted) 52% 60%, transparent 60% 74%, var(--muted) 74% 82%, transparent 82%);
    opacity: 0.6;
  }
  @media (max-width: 699px) {
    .rs { display: none; }
    .m-head { cursor: default; }
  }

  /* About me pop-up */
  dialog.modal.about { width: min(900px, calc(100% - 1.5rem)); height: min(88vh, 720px); height: min(88dvh, 720px); }
  .m-body.single .pane.right { padding: 2rem 2.5rem; }
  .m-body.single { grid-template-columns: minmax(0, 1fr); }
  .m-body.single .pane.left { display: none; }

function renderExperience() {

function renderRight() {
  const p = state.projects[state.p];
  if (!p) { $("m-right").innerHTML = `<p class="pending">Projects for this area are coming soon.</p>`; return; }
  const imgs = p.images || [];
  const vid = p.video ? p.video.replace(/\/view.*$/, "/preview") : "";
  const cur = imgs[state.i];
  const stage = imgs.length
    ? `<img src="${esc(cur.src)}" alt="${esc(cur.caption || p.title)}">
       ${imgs.length > 1 ? `<button class="nav prev" type="button" data-nav="-1" aria-label="Previous image">&#8249;</button>
       <button class="nav next" type="button" data-nav="1" aria-label="Next image">&#8250;</button>` : ""}`
    : vid ? `<iframe src="${esc(vid)}" title="${esc(p.title)} demo video" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>`
    : `<div class="empty"><span class="pet" style="--d:0s">${catSVG("#E8A15C", "#16202C", false, 56)}</span><br>Screenshots coming soon.</div>`;
  const thumbs = imgs.length > 1
    ? `<div class="thumbs">${imgs.map((im, k) => `<button type="button" class="thumb" data-thumb="${k}" aria-current="${k === state.i}" aria-label="Image ${k + 1}"><img src="${esc(im.src)}" alt=""></button>`).join("")}</div>`
    : "";
  const btns = [];
  if (p.download) btns.push(`<a class="btn" href="${esc(p.download)}" download>Download project (.zip)</a>`);
  if (p.readme) btns.push(`<a class="btn quiet" href="${esc(p.readme)}" target="_blank" rel="noopener">Read the README</a>`);
  if (p.demo) btns.push(`<a class="btn quiet" href="${esc(p.demo)}" target="_blank" rel="noopener">Live demo</a>`);
  if (p.video) btns.push(`<a class="btn quiet" href="${esc(p.video)}" target="_blank" rel="noopener">Watch demo video</a>`);
  if (p.code) btns.push(`<a class="btn quiet" href="${esc(p.code)}" target="_blank" rel="noopener">Source on GitHub</a>`);
  if (!btns.length) btns.push(`<span class="pending">No links yet</span>`);

  $("m-right").innerHTML = `
    <div class="stage" id="stage">${stage}</div>
    <p class="caption">${imgs.length ? esc(cur.caption || "") : ""}</p>
    ${thumbs}
    <div class="detail">
      <h3>${esc(p.title)} <span class="status${p.status === "soon" ? " soon" : ""}">${p.status === "soon" ? "In progress" : "Built"}</span></h3>

      <div class="btns">${btns.join("")}</div>

/* Shareable links: each pop-up has its own #address, and the Back button closes it */
let currentId = "";
const pushRoute = id => { try { history.pushState({ modal: id }, "", "#" + id); } catch (e) {} };
const markDeep = id => { try { if (!history.state || !history.state.modal) history.replaceState({ modal: id, deep: true }, "", "#" + id); } catch (e) {} };

function openRole(id, fromRoute) {
  currentId = id;
  fromRoute ? markDeep(id) : pushRoute(id);
  modal.removeAttribute("style");
  modal.classList.remove("about");
  modal.querySelector(".m-body").classList.remove("single");
  state.role = ROLES.find(r => r.id === id);
  state.projects = projectsFor(state.role);
  state.p = 0; state.i = 0;
  if (state.role.sections && !state.projects.length) {
    modal.classList.add("about");
    modal.querySelector(".m-body").classList.add("single");
    renderExperience();
  } else { renderLeft(); renderRight(); }
  document.body.style.overflow = "hidden";
  if (!modal.open) modal.showModal();
  modal.querySelectorAll(".pane").forEach(el => el.scrollTop = 0);
  modal.querySelector(".m-body").scrollTop = 0;
}

function step(d) {
  if (modal.classList.contains("about") || !state.projects[state.p]) return;
  const n = (state.projects[state.p].images || []).length;
  if (n < 2) return;
  state.i = (state.i + d + n) % n;
  renderRight();
}

$("mesh").addEventListener("click", e => {
  const t = e.target.closest("[data-role]");
  if (t) openRole(t.dataset.role);
});

modal.addEventListener("click", e => {
  if (e.target === modal) return modal.close();
  const proj = e.target.closest("[data-proj]");
  if (proj) {
    state.p = +proj.dataset.proj; state.i = 0;
    modal.querySelectorAll(".proj-btn").forEach((b, k) => b.setAttribute("aria-current", k === state.p));
    renderRight();
    modal.querySelector(".pane.right").scrollTop = 0;
    return;
  }
  const thumb = e.target.closest("[data-thumb]");
  if (thumb) { state.i = +thumb.dataset.thumb; renderRight(); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav) { step(+nav.dataset.nav); return; }
  if (e.target.matches("#stage img")) {
    lbImg.src = e.target.src; lbImg.alt = e.target.alt; lightbox.showModal();
  }
});

modal.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
modal.addEventListener("close", () => {
  document.body.style.overflow = "";
  const st = history.state;
  if (st && st.modal) {
    try { st.deep ? history.replaceState(null, "", location.pathname + location.search) : history.back(); } catch (e) {}
  }
});
$("m-close").addEventListener("click", () => modal.close());
lightbox.addEventListener("click", () => lightbox.close());

/* Copy a link to the open pop-up */
$("m-copy").addEventListener("click", async () => {
  const url = location.href.split("#")[0] + "#" + currentId, btn = $("m-copy");
  try { await navigator.clipboard.writeText(url); }
  catch (e) {
    const t = document.createElement("textarea");
    t.value = url; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (_) {}
    t.remove();
  }
  btn.textContent = "Copied!";
  setTimeout(() => { btn.textContent = "Copy link"; }, 1800);
});

/* Drag by the header, resize from any edge or corner (desktop widths only) */
const MIN_W = 380, MIN_H = 300;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const canMove = () => window.innerWidth >= 700;

function freeze() {
  const r = modal.getBoundingClientRect();
  Object.assign(modal.style, {
    margin: "0", right: "auto", bottom: "auto",
    left: r.left + "px", top: r.top + "px",
    width: r.width + "px", height: r.height + "px",
    maxWidth: "none", maxHeight: "none"
  });
  return r;
}

function track(el, e, onMove) {
  el.setPointerCapture(e.pointerId);
  const move = ev => onMove(ev.clientX - e.clientX, ev.clientY - e.clientY);
  const up = () => {
    el.removeEventListener("pointermove", move);
    el.removeEventListener("pointerup", up);
    el.removeEventListener("pointercancel", up);
  };
  el.addEventListener("pointermove", move);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
}

const head = modal.querySelector(".m-head");
head.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !canMove() || e.target.closest(".x, .copy")) return;
  const r = freeze();
  track(head, e, (dx, dy) => {
    modal.style.left = clamp(r.left + dx, 120 - r.width, window.innerWidth - 120) + "px";
    modal.style.top = clamp(r.top + dy, 0, window.innerHeight - 56) + "px";
  });
});

["n", "s", "e", "w", "ne", "nw", "se", "sw"].forEach(dir => {
  const h = document.createElement("div");
  h.className = "rs rs-" + dir;
  h.setAttribute("aria-hidden", "true");
  modal.appendChild(h);
  h.addEventListener("pointerdown", e => {
    if (e.button !== 0 || !canMove()) return;
    e.preventDefault();
    const r = freeze();
    track(h, e, (dx, dy) => {
      let l = r.left, t = r.top, w = r.width, ht = r.height;
      if (dir.includes("e")) w = r.width + dx;
      if (dir.includes("s")) ht = r.height + dy;
      if (dir.includes("w")) { w = r.width - dx; l = r.left + dx; }
      if (dir.includes("n")) { ht = r.height - dy; t = r.top + dy; }
      if (w < MIN_W) { if (dir.includes("w")) l -= MIN_W - w; w = MIN_W; }
      if (ht < MIN_H) { if (dir.includes("n")) t -= MIN_H - ht; ht = MIN_H; }
      if (l < 0) { if (dir.includes("w")) w += l; l = 0; }
      if (t < 0) { if (dir.includes("n")) ht += t; t = 0; }
      if (l + w > window.innerWidth) w = window.innerWidth - l;
      if (t + ht > window.innerHeight) ht = window.innerHeight - t;
      Object.assign(modal.style, { left: l + "px", top: t + "px", width: w + "px", height: ht + "px" });
    });
  });
});

/* Intro: the headline types out once (the name stays static) */
(function intro() {
  const hl = document.querySelector(".hero .headline");
  const tag = hl.textContent.trim();
  hl.setAttribute("aria-label", tag);
  if (reduce) return;
  hl.innerHTML = `<span class="caret" id="caret" aria-hidden="true"></span>` +
    tag.split(" ").map(w => `<span class="word" aria-hidden="true">${[...w].map(ch => `<span class="tw">${esc(ch)}</span>`).join("")}</span>`).join(" ");
  const chars = [...hl.querySelectorAll(".tw")], caret = $("caret");
  let n = 0;
  setTimeout(function type() {
    if (n < chars.length) {
      chars[n].classList.add("on");
      chars[n].after(caret);
      n++;
      setTimeout(type, 34 + Math.random() * 40);
    } else {
      setTimeout(() => caret.classList.add("gone"), 2200);
    }
  }, 600);
})();

/* Background glow: a soft light follows the cursor outside the tiles and pop-ups.
   Clicking empty space leaves a paw print. */
(function waterShade() {
  if (reduce) return;
  const cv = $("fx"), ctx = cv.getContext("2d");
  let W = 0, H = 0, rgb = [27, 77, 219];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function readColor() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1B4DDB";
    const hex = ctx.fillStyle;
    if (/^#[0-9a-f]{6}$/i.test(hex)) rgb = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  }
  resize(); readColor();
  addEventListener("resize", resize);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColor);

  const m = { x: 0, y: 0, gx: 0, gy: 0, on: false, a: 0 };
  const paws = [];
  let running = false, last = 0, spawn = { x: -999, y: -999, t: 0 };
  const SKIP = ".mesh, dialog, button, a, .peek-cat, .footer-dog";

  function start() {
    if (running) return;
    running = true; last = performance.now();
    requestAnimationFrame(tick);
  }

  addEventListener("pointermove", e => {
    if (e.pointerType === "touch") return;
    m.x = e.clientX; m.y = e.clientY;
    if (!m.a) { m.gx = m.x; m.gy = m.y; }
    m.on = !e.target.closest(".mesh, dialog, .peek-cat, .footer-dog");
    start();
  }, { passive: true });

  document.documentElement.addEventListener("pointerleave", () => { m.on = false; start(); });

  addEventListener("pointerdown", e => {
    if (e.target.closest(SKIP)) return;
    paws.push({ x: e.clientX, y: e.clientY, t: performance.now(), rot: (Math.random() - 0.5) * 0.9 });
    start();
  });

  function drawPaw(x, y, rot, al) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${al})`;
    const e = (cx, cy, rx, ry, a) => { ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, a, 0, Math.PI * 2); ctx.fill(); };
    e(0, 7, 10, 8, 0); e(-12, -4, 4, 5.5, -0.35); e(-4.5, -12, 4, 5.5, -0.12); e(4.5, -12, 4, 5.5, 0.12); e(12, -4, 4, 5.5, 0.35);
    ctx.restore();
  }

  function tick(now) {
    const k = Math.min(48, now - last) / 16.7; last = now;
    m.a += ((m.on ? 1 : 0) - m.a) * Math.min(1, 0.08 * k);
    m.gx += (m.x - m.gx) * Math.min(1, 0.12 * k);
    m.gy += (m.y - m.gy) * Math.min(1, 0.12 * k);
    ctx.clearRect(0, 0, W, H);
    const [r, g, b] = rgb;

    if (m.a > 0.01) {
      const R = 100, gr = ctx.createRadialGradient(m.gx, m.gy, 0, m.gx, m.gy, R);
      gr.addColorStop(0, `rgba(${r},${g},${b},${0.05 * m.a})`);
      gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = gr;
      ctx.fillRect(m.gx - R, m.gy - R, R * 2, R * 2);
    }
    for (let i = paws.length - 1; i >= 0; i--) {
      const p = paws[i], age = (now - p.t) / 2400;
      if (age >= 1) { paws.splice(i, 1); continue; }
      drawPaw(p.x, p.y, p.rot, age < 0.15 ? (age / 0.15) * 0.5 : (1 - age) * 0.59);
    }
    if (m.a > 0.01 || m.on || paws.length) requestAnimationFrame(tick);
    else running = false;
  }
})();

   TOOLS: name, short mark, brand colour. Swap any badge for an official logo later if you like. */
(function toolsStrip() {
  const TOOLS = [
    ["Python", "Py", "#3776AB"], ["SQL", "SQL", "#336791"], ["PostgreSQL", "Pg", "#336791"], ["R", "R", "#276DC3"], ["Shiny", "Sh", "#2D6CB0"],

    ["Node.js", "N", "#5FA04E"], ["Express", "Ex", "#444B55"], ["REST APIs", "API", "#7B4DDB"], ["Webhooks", "WH", "#C73A63"],
    ["n8n", "n8n", "#EA4B71"], ["Power BI", "BI", "#F2C811", 1], ["Power Query", "PQ", "#217346"], ["Excel", "X", "#1D6F42"],

})();
