<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Approval Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════
     WELCOME MODE
════════════════════════════════════════════ -->
<div id="welcomeSection">
  <div class="welcome-inner">
    <div class="welcome-logo">SAP</div>
    <h1 class="welcome-title">School Approval Portal</h1>
    <p class="welcome-subtitle">Search across all exception sheets instantly.</p>

    <div class="search-wrap">
      <input
        id="welcomeSearch"
        class="search-input"
        type="text"
        placeholder="Search by country, exception, keyword…"
        onkeydown="if(event.key==='Enter') triggerSearch();"
        autocomplete="off"
      />
      <button class="search-btn" onclick="triggerSearch()">Search</button>
    </div>

    <div class="chip-row" id="welcomeChips">
      <label class="chip"><input type="checkbox" value="eois"                       checked onchange="syncChips('welcome')"><span>EOIs</span></label>
      <label class="chip"><input type="checkbox" value="postapprovalexceptions"     checked onchange="syncChips('welcome')"><span>Post Approval</span></label>
      <label class="chip"><input type="checkbox" value="governmentpermissions"      checked onchange="syncChips('welcome')"><span>Gov Permissions</span></label>
      <label class="chip"><input type="checkbox" value="registrationexceptions"     checked onchange="syncChips('welcome')"><span>Registration</span></label>
      <label class="chip"><input type="checkbox" value="annualinvoicingexceptions"  checked onchange="syncChips('welcome')"><span>Annual Invoicing</span></label>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     APP MODE
════════════════════════════════════════════ -->
<div id="appSection">

  <header class="top-bar">

    <!-- Home button -->
    <button class="home-btn" onclick="goHome()" title="Back to welcome">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>

    <span class="top-bar-title">School Approval Portal</span>

    <!-- Search bar -->
    <div class="top-search-wrap">
      <input
        id="appSearch"
        class="search-input small"
        type="text"
        placeholder="Search country, exception, keyword…"
        onkeydown="if(event.key==='Enter') runSearch();"
        oninput="debounceSearch();"
        autocomplete="off"
      />
      <button class="search-btn small" onclick="runSearch()">Search</button>
    </div>

    <!-- Refresh button -->
    <button class="refresh-btn" id="refreshBtn" onclick="refreshData()" title="Reload data from Dataverse">
      <svg id="refreshIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0114.13-3.36L23 10M1 14l5.36 4.36A9 9 0 0020.49 15"/>
      </svg>
      <span id="refreshLabel">Refresh</span>
    </button>

    <!-- Filter chips -->
    <div class="chip-row inline" id="appChips">
      <label class="chip"><input type="checkbox" value="eois"                       checked onchange="syncChips('app'); runSearch();"><span>EOIs</span></label>
      <label class="chip"><input type="checkbox" value="postapprovalexceptions"     checked onchange="syncChips('app'); runSearch();"><span>Post Approval</span></label>
      <label class="chip"><input type="checkbox" value="governmentpermissions"      checked onchange="syncChips('app'); runSearch();"><span>Gov Permissions</span></label>
      <label class="chip"><input type="checkbox" value="registrationexceptions"     checked onchange="syncChips('app'); runSearch();"><span>Registration</span></label>
      <label class="chip"><input type="checkbox" value="annualinvoicingexceptions"  checked onchange="syncChips('app'); runSearch();"><span>Annual Invoicing</span></label>
    </div>

  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-heading">
        <span id="matchCount">Results</span>
        <div class="sidebar-nav" id="sidebarNav"></div>
      </div>
      <div class="sidebar-list" id="sidebarList">
        <p class="hint">Your results will appear here.</p>
      </div>
    </aside>

    <main class="stage" id="resultArea">
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>Use the search bar above to find exception records.</p>
      </div>
    </main>
  </div>
</div>


<!-- ═══════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════ -->
<script>

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
let masterData     = [];
let currentResults = [];
let currentIndex   = 0;
let dataLoaded     = false;
let searchTimer    = null;

const SIDEBAR_PAGE = 20;
let sidebarPage    = 0;

/* ── New table ──────────────────────────────────────────── */
const TABLE = "cr557_satportalv3s";


/* ═══════════════════════════════════════════════════════════
   JARGON MAP
   Allows short-form searches (e.g. "ey" → matches "early years")
═══════════════════════════════════════════════════════════ */
const JARGON_MAP = {
  "ey": "early years", "eyp": "early years", "early yrs": "early years",
  "kinder": "early years", "kindergarten": "early years", "nursery": "early years",
  "preschool": "early years", "pre-school": "early years",
  "foundation": "early years", "fs1": "early years", "fs2": "early years",
  "pri": "primary", "elementary": "primary", "grade school": "primary",
  "lower sec": "lower secondary", "ls": "lower secondary",
  "checkpoint": "lower secondary", "middle school": "lower secondary",
  "junior high": "lower secondary", "pre-ig": "lower secondary",
  "upper sec": "upper secondary", "igcse": "upper secondary",
  "ig": "upper secondary", "o level": "upper secondary", "olevel": "upper secondary",
  "a level": "advanced", "a-level": "advanced", "as level": "advanced",
  "sixth form": "advanced", "adv": "advanced",
  "gqs": "gq", "sec & adv": "gq"
};

/* Sort longest first so multi-word phrases match before single words */
const JARGON_KEYS = Object.keys(JARGON_MAP).sort((a, b) => b.length - a.length);

function applyJargon(str) {
  if (!str) return "";
  let res = str.toLowerCase();
  JARGON_KEYS.forEach(term => {
    const safe  = term.replace(/[-/\\^$*+?.()|[\]{}]/g, "\\$&");
    const regex = new RegExp("\\b" + safe + "\\b", "g");
    res = res.replace(regex, JARGON_MAP[term]);
  });
  return res;
}


/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */

function isEmpty(val) {
  if (val === null || val === undefined) return true;
  const s = String(val).trim();
  return s === "" || /^[-—–]+$/.test(s);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/*
  Date handling — cr557_Date is stored as Single line of text in the new table.
  Still handles ISO strings and Excel serials gracefully.
*/
function formatDate(raw) {
  if (isEmpty(raw)) return "";
  const s = String(raw).trim();

  if (isNaN(s.replace(/,/g, ""))) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      const dd   = String(d.getDate()).padStart(2, "0");
      const mm   = String(d.getMonth() + 1).padStart(2, "0");
      const yyyy = d.getFullYear();
      return dd + "/" + mm + "/" + yyyy;
    }
    return s;
  }

  const num  = parseFloat(s.replace(/,/g, ""));
  const date = new Date((num - 25569) * 86400 * 1000);
  if (isNaN(date.getTime())) return s;
  const dd   = String(date.getDate()).padStart(2, "0");
  const mm   = String(date.getMonth() + 1).padStart(2, "0");
  const yyyy = date.getFullYear();
  return dd + "/" + mm + "/" + yyyy;
}


/* ═══════════════════════════════════════════════════════════
   DATA MAPPING  —  new table cr557_satportalv3s
   Columns from Dataverse (OData logical names are lowercase):
     cr557_sourcesheet, cr557_country, cr557_region,
     cr557_customertype, cr557_programme, cr557_process,
     cr557_exceptiontype, cr557_exception, cr557_source,
     cr557_date, cr557_note, cr557_supportingdocs,
     cr557_excelrow
═══════════════════════════════════════════════════════════ */
function mapRecord(d) {
  const rec = {
    /* Sheet key — normalised to match chip values */
    sheet:          (d.cr557_sourcesheet  || "").toLowerCase().replace(/\s+/g, "").trim(),

    country:         d.cr557_country       || "",
    region:          d.cr557_region        || "",
    customer_type:   d.cr557_customertype  || "",
    programme:       d.cr557_programme     || "",
    process:         d.cr557_process       || "",
    exception_type:  d.cr557_exceptiontype || "",
    exception:       d.cr557_exception     || "",
    source:          d.cr557_source        || "",
    date:            formatDate(d.cr557_date),
    note:            d.cr557_note          || "",
    supporting_docs: d.cr557_supportingdocs|| "",
    excel_row:       d.cr557_excelrow      != null ? String(d.cr557_excelrow) : ""
  };

  /* Pre-build searchable text (jargon-normalised) — computed once, fast at search time */
  rec._searchText = applyJargon(
    Object.values(rec)
      .filter(v => v !== null && v !== undefined)
      .map(String)
      .join(" ")
  );

  return rec;
}


/* ═══════════════════════════════════════════════════════════
   DATAVERSE FETCH
═══════════════════════════════════════════════════════════ */
const COLS = [
  "cr557_sourcesheet",
  "cr557_country",
  "cr557_region",
  "cr557_customertype",
  "cr557_programme",
  "cr557_process",
  "cr557_exceptiontype",
  "cr557_exception",
  "cr557_source",
  "cr557_date",
  "cr557_note",
  "cr557_supportingdocs",
  "cr557_excelrow"
].join(",");

async function loadData(isRefresh) {
  const btn   = document.getElementById("refreshBtn");
  const icon  = document.getElementById("refreshIcon");
  const label = document.getElementById("refreshLabel");

  if (btn) {
    btn.disabled = true;
    if (icon)  icon.classList.add("spinning");
    if (label) label.textContent = "Loading…";
  }

  try {
    const res = await fetch("/_api/" + TABLE + "?$select=" + COLS + "&$top=5000");

    if (res.status === 401) {
      console.warn("SAP: session expired — reloading page.");
      location.reload();
      return;
    }

    if (!res.ok) {
      throw new Error("Fetch failed: HTTP " + res.status);
    }

    const json = await res.json();
    masterData = (json.value || []).map(mapRecord);
    dataLoaded = true;

    console.log("SAP: loaded", masterData.length, "records.");
    console.log("SAP: sheets found:", [...new Set(masterData.map(r => r.sheet))]);

    if (isRefresh) {
      runSearch();
      if (label) label.textContent = "Updated!";
      setTimeout(() => { if (label) label.textContent = "Refresh"; }, 2000);
    }

  } catch (err) {
    console.error("SAP: loadData failed:", err);
    if (label) label.textContent = "Retry";
  } finally {
    if (btn)  btn.disabled = false;
    if (icon) icon.classList.remove("spinning");
  }
}

function refreshData() {
  loadData(true);
}

loadData(false);


/* ═══════════════════════════════════════════════════════════
   FIELD DEFINITIONS — drives the card renderer
   Reflects the flat schema of cr557_satportalv3:
     meta     → region, customer_type, programme, exception_type
     core     → exception
     process  → process
     evidence → supporting_docs, source, date
     notes    → note
═══════════════════════════════════════════════════════════ */
const FIELD_DEFS = [
  { key: "region",         label: "Region",                   type: "badge", group: "meta"     },
  { key: "customer_type",  label: "Customer Type",            type: "badge", group: "meta"     },
  { key: "programme",      label: "Programme",                type: "badge", group: "meta"     },
  { key: "exception_type", label: "Exception Type",           type: "badge", group: "meta"     },

  { key: "exception",      label: "Exception",                type: "text",  group: "core"     },

  { key: "process",        label: "Process",                  type: "text",  group: "process"  },

  { key: "supporting_docs",label: "Supporting Emails / Docs", type: "docs",  group: "evidence" },
  { key: "source",         label: "Source",                   type: "meta",  group: "evidence" },
  { key: "date",           label: "Date Updated",             type: "meta",  group: "evidence" },

  { key: "note",           label: "Note",                     type: "note",  group: "notes"    }
];

const GROUP_ORDER  = ["meta", "core", "process", "evidence", "notes"];
const GROUP_LABELS = { meta: null, core: null, process: null, evidence: null, notes: null };


/* ═══════════════════════════════════════════════════════════
   CHIP SYNC
═══════════════════════════════════════════════════════════ */
function syncChips(source) {
  const fromId = source === "welcome" ? "welcomeChips" : "appChips";
  const toId   = source === "welcome" ? "appChips"     : "welcomeChips";
  const from   = document.querySelectorAll("#" + fromId + " input[type=checkbox]");
  const to     = document.querySelectorAll("#" + toId   + " input[type=checkbox]");
  from.forEach((cb, i) => { if (to[i]) to[i].checked = cb.checked; });
}

function getActiveSheets() {
  return Array.from(document.querySelectorAll("#appChips input[type=checkbox]:checked"))
              .map(cb => cb.value.toLowerCase().replace(/\s+/g, ""));
}


/* ═══════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════ */
function triggerSearch() {
  const q = document.getElementById("welcomeSearch").value.trim();
  if (!q) return;

  document.getElementById("appSearch").value = q;
  syncChips("welcome");

  document.getElementById("welcomeSection").style.display = "none";
  document.getElementById("appSection").style.display     = "grid";

  if (!dataLoaded) {
    document.getElementById("resultArea").innerHTML =
      '<div class="empty-state"><div class="empty-icon">⏳</div><p>Loading data, please wait…</p></div>';
    return;
  }

  runSearch();
}

function goHome() {
  document.getElementById("appSection").style.display     = "none";
  document.getElementById("welcomeSection").style.display = "flex";
  document.getElementById("welcomeSearch").value =
    document.getElementById("appSearch").value;
}


/* ═══════════════════════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════════════════════ */
function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 220);
}

function runSearch() {
  if (!dataLoaded || !masterData.length) return;

  const rawQuery  = document.getElementById("appSearch").value.trim();
  const normQuery = applyJargon(rawQuery.toLowerCase());
  const keywords  = normQuery.split(/\s+/).filter(Boolean);
  const sheets    = getActiveSheets();

  if (sheets.length === 0) {
    currentResults = [];
    renderNoResults("No sheet filters selected. Please check at least one filter above.");
    return;
  }

  currentResults = masterData.filter(row => {
    if (!row) return false;
    if (!sheets.includes(row.sheet)) return false;
    if (keywords.length === 0) return true;
    return keywords.every(kw => row._searchText.includes(kw));
  });

  currentIndex = 0;
  sidebarPage  = 0;
  renderDisplay();
}


/* ═══════════════════════════════════════════════════════════
   DISPLAY
═══════════════════════════════════════════════════════════ */
function renderDisplay() {
  if (currentResults.length === 0) {
    renderNoResults("No results found. Try a different keyword or adjust your filters.");
    return;
  }
  renderSidebar();
  renderCard(currentResults[currentIndex]);
}

function renderNoResults(msg) {
  document.getElementById("matchCount").textContent = "0 results";
  document.getElementById("sidebarList").innerHTML  = '<p class="hint">' + escHtml(msg) + "</p>";
  document.getElementById("sidebarNav").innerHTML   = "";
  document.getElementById("resultArea").innerHTML   =
    '<div class="card"><div class="no-result-msg">' +
    '<div class="empty-icon">🔎</div><p>' + escHtml(msg) + "</p></div></div>";
}


/* ═══════════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════════ */
function renderSidebar() {
  const total      = currentResults.length;
  const totalPages = Math.ceil(total / SIDEBAR_PAGE);
  const start      = sidebarPage * SIDEBAR_PAGE;

  document.getElementById("matchCount").textContent =
    total + " result" + (total !== 1 ? "s" : "");

  document.getElementById("sidebarList").innerHTML =
    currentResults.slice(start, Math.min(start + SIDEBAR_PAGE, total))
      .map((item, i) => {
        const gIdx   = start + i;
        const active = gIdx === currentIndex;
        const raw    = item.exception || "";
        const teaser = raw.length > 70 ? raw.substring(0, 70).trim() + "…" : (raw || "—");
        const hints  = [item.region, item.customer_type, item.exception_type]
          .filter(v => !isEmpty(v))
          .map(v => '<span class="pill-badge">' + escHtml(v) + "</span>")
          .join("");

        return (
          '<div class="pill ' + (active ? "active" : "") + '" onclick="jumpTo(' + gIdx + ')">' +
          '<div class="pill-sheet">' + sheetLabel(item.sheet) + "</div>" +
          '<div class="pill-country">' + escHtml(item.country || "General") + "</div>" +
          (hints ? '<div class="pill-badges">' + hints + "</div>" : "") +
          '<div class="pill-teaser">' + escHtml(teaser) + "</div>" +
          "</div>"
        );
      }).join("");

  const nav = document.getElementById("sidebarNav");
  nav.innerHTML = totalPages <= 1 ? "" :
    '<button class="mini-btn" onclick="moveSidebarPage(-1)" ' + (sidebarPage === 0 ? "disabled" : "") + ">‹</button>" +
    '<span class="sidebar-page-label">' + (sidebarPage + 1) + "/" + totalPages + "</span>" +
    '<button class="mini-btn" onclick="moveSidebarPage(1)" '  + (sidebarPage >= totalPages - 1 ? "disabled" : "") + ">›</button>";
}

function moveSidebarPage(dir) {
  sidebarPage = Math.max(0, Math.min(
    sidebarPage + dir,
    Math.ceil(currentResults.length / SIDEBAR_PAGE) - 1
  ));
  renderSidebar();
}

function jumpTo(globalIndex) {
  currentIndex = globalIndex;
  sidebarPage  = Math.floor(currentIndex / SIDEBAR_PAGE);
  renderSidebar();
  renderCard(currentResults[currentIndex]);
}

function changeResult(dir) {
  const n = currentIndex + dir;
  if (n >= 0 && n < currentResults.length) jumpTo(n);
}


/* ═══════════════════════════════════════════════════════════
   TEXT HELPERS
═══════════════════════════════════════════════════════════ */
function sheetLabel(raw) {
  const map = {
    "eois":                      "EOIs",
    "postapprovalexceptions":    "Post Approval",
    "governmentpermissions":     "Gov Permissions",
    "registrationexceptions":    "Registration",
    "annualinvoicingexceptions": "Annual Invoicing"
  };
  return map[(raw || "").toLowerCase()] || raw || "Unknown";
}

function isMonsterCountry(str) {
  if (!str) return false;
  const s = String(str);
  return s.trim().split(/\s+/).length > 3 || s.includes(",") ||
         s.includes(". ") || s.includes("(cc ") || s.length > 40;
}

function isMonsterCard(item) {
  return ["exception", "process", "notes", "note"]
    .some(k => item[k] && String(item[k]).length > 400);
}

/* Turns newline-separated text into readable paragraphs */
function beautifyText(raw) {
  if (!raw) return "";
  const lines = String(raw).trim()
    .split("\n")
    .map(l => l.trim())
    .filter(l => l.length > 0 && !/^[-—–]+$/.test(l));
  if (lines.length === 0) return "";
  const cls = lines.length > 10 ? "pretty-text multi-col" : "pretty-text";
  return '<div class="' + cls + '">' +
    lines.map(l => "<p>" + escHtml(l) + "</p>").join("") +
    "</div>";
}


/* ═══════════════════════════════════════════════════════════
   CARD RENDERER
═══════════════════════════════════════════════════════════ */
function renderCard(item) {
  const area           = document.getElementById("resultArea");
  const cardClass      = isMonsterCard(item) ? "card monster" : "card";
  const countryMonster = isMonsterCountry(item.country);
  const titleText      = countryMonster ? "Additional Info" : escHtml(item.country || "General");

  let sectionsHtml = "";

  for (const groupKey of GROUP_ORDER) {
    const filled = FIELD_DEFS.filter(f => f.group === groupKey && !isEmpty(item[f.key]));
    if (filled.length === 0) continue;

    const divLabel = GROUP_LABELS[groupKey];
    const divider  = divLabel
      ? '<div class="section-divider"><span>' + escHtml(divLabel) + "</span></div>"
      : "";

    let body       = "";
    let metaKvHtml = "";

    if (groupKey === "meta") {
      body = '<div class="meta-row">' +
        filled.map(f =>
          '<div class="meta-badge">' +
          '<span class="meta-badge-label">' + escHtml(f.label) + "</span>" +
          '<span class="meta-badge-value">' + escHtml(String(item[f.key])) + "</span>" +
          "</div>"
        ).join("") +
        "</div>";

    } else {
      for (const f of filled) {
        const val = String(item[f.key]);

        if (f.type === "text") {
          body += '<div class="card-section">' +
            '<div class="section-label">' + escHtml(f.label) + "</div>" +
            '<div class="section-body">'  + beautifyText(val)  + "</div>" +
            "</div>";

        } else if (f.type === "docs") {
          body += '<div class="card-section">' +
            '<div class="section-label">' + escHtml(f.label)  + "</div>" +
            '<div class="docs-box">'       + beautifyText(val) + "</div>" +
            "</div>";

        } else if (f.type === "meta") {
          metaKvHtml +=
            '<div class="meta-kv">' +
            '<span class="meta-kv-label">' + escHtml(f.label) + "</span>" +
            '<span class="meta-kv-value">' + escHtml(val)      + "</span>" +
            "</div>";

        } else if (f.type === "note") {
          body += '<div class="note-box">' +
            '<div class="note-label">📌 ' + escHtml(f.label) + "</div>" +
            beautifyText(val) +
            "</div>";
        }
      }

      if (metaKvHtml) {
        body += '<div class="card-section"><div class="meta-kv-wrap">' + metaKvHtml + "</div></div>";
      }
    }

    sectionsHtml += '<div class="card-group">' + divider + body + "</div>";
  }

  area.innerHTML =
    '<div class="' + cardClass + '">' +

    '<div class="card-header">' +
      '<div class="card-header-left">' +
        '<span class="type-tag">' + sheetLabel(item.sheet) + "</span>" +
        '<h2 class="card-title">'  + titleText              + "</h2>"  +
      "</div>" +
      '<div class="card-nav">' +
        '<button class="nav-btn" onclick="changeResult(-1)" ' + (currentIndex === 0 ? "disabled" : "") + ">← Back</button>" +
        '<span class="nav-count">' + (currentIndex + 1) + " of " + currentResults.length + "</span>" +
        '<button class="nav-btn" onclick="changeResult(1)" '  + (currentIndex === currentResults.length - 1 ? "disabled" : "") + ">Next →</button>" +
      "</div>" +
    "</div>" +

    (countryMonster ? '<div class="monster-box">' + beautifyText(item.country) + "</div>" : "") +
    (sectionsHtml   || '<p class="empty" style="padding:20px 0">No data for this record.</p>') +

    "</div>";
}

</script>
</body>
