<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jay Magayanes | Data, Support and Automation</title>
<meta name="description" content="Remote professional with seven years of experience in data analysis, technical support, customer support, operations and automation. Open a role to see the work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F7F9;
    --surface: #FFFFFF;
    --ink: #16202C;
    --muted: #556070;
    --line: #DCE1E8;
    --accent: #1B4DDB;
    --accent-ink: #FFFFFF;
    --soft: #E8EEFC;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F151D;
      --surface: #151D28;
      --ink: #E8ECF2;
      --muted: #9AA6B5;
      --line: #263141;
      --accent: #7FA0FF;
      --accent-ink: #0F151D;
      --soft: #1A2640;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem; }

  /* Hero */
  .hero { padding: 3rem 0 2rem; display: grid; gap: 1.25rem 3rem; }
  @media (min-width: 900px) { .hero { grid-template-columns: 1.1fr 1fr; align-items: end; } }
  .hero h1 { font-size: clamp(2.6rem, 7vw, 4.75rem); font-weight: 700; }
  .hero .headline {
    font-family: var(--display); font-weight: 500; color: var(--muted);
    font-size: clamp(1.1rem, 2.2vw, 1.5rem); margin: 0.75rem 0 0; letter-spacing: -0.01em;
  }
  .hero .intro { margin: 0; color: var(--muted); max-width: 44ch; }
  .contact { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; margin: 0.75rem 0 0; padding: 0; list-style: none; font-weight: 600; }

  /* Tile mesh: tiles share hairline borders */
  .mesh {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  @media (min-width: 620px) { .mesh { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 900px) {
    .mesh { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .tile { grid-column: span 2; }
    .tile.wide { grid-column: span 3; }
  }
  .tile {
    font: inherit; color: inherit; text-align: left;
    background: var(--surface);
    border: 0; margin: 0;
    padding: 1.4rem 1.4rem 1.1rem;
    min-height: 190px;
    display: flex; flex-direction: column; gap: 0.5rem;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .tile:hover { background: var(--soft); }
  .tile:focus-visible { outline-offset: -4px; }
  .tile h2 { font-size: 1.55rem; font-weight: 700; }
  .tile:hover h2 { color: var(--accent); }
  .tile .blurb { color: var(--muted); margin: 0; }
  .tile .chips { margin: 0; font-size: 0.9rem; }
  .tile .foot {
    margin-top: auto; display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 0.9rem;
  }
  .tile .plus {
    width: 1.75rem; height: 1.75rem; border-radius: 50%;
    border: 1.5px solid var(--accent); color: var(--accent);
    display: grid; place-items: center; font-size: 1.2rem; line-height: 1;
  }
  .tile:hover .plus { background: var(--accent); color: var(--accent-ink); }

  footer { padding: 1.25rem 0 2rem; color: var(--muted); font-size: 0.875rem; }

  /* Pop-up */
  dialog { color: var(--ink); }
  dialog.modal {
    width: min(1040px, calc(100% - 1.5rem));
    height: min(90vh, 740px);
    padding: 0; margin: auto;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
  }
  dialog.modal[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(8, 14, 22, 0.6); }
  .m-head {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--line);
  }
  .m-head h2 { font-size: 1.5rem; font-weight: 700; }
  .x {
    font: inherit; font-size: 1.4rem; line-height: 1;
    width: 2.25rem; height: 2.25rem; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .x:hover { background: var(--soft); }
  .m-body { flex: 1; min-height: 0; overflow-y: auto; display: block; }
  @media (min-width: 860px) {
    .m-body { display: grid; grid-template-columns: 300px minmax(0, 1fr); overflow: hidden; }
    .pane { overflow-y: auto; min-height: 0; }
    .pane.left { border-right: 1px solid var(--line); }
  }
  .pane { padding: 1.25rem; }
  .pane .summary { margin: 0 0 1rem; color: var(--muted); }
  dl.skills { margin: 0 0 1.5rem; }
  dl.skills dt { font-weight: 600; margin-top: 0.75rem; }
  dl.skills dd { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.95rem; }
  .list-title { font-family: var(--display); font-size: 1.05rem; font-weight: 700; margin: 0 0 0.5rem; }
  .proj-list { display: flex; flex-direction: column; gap: 0.35rem; }
  .proj-btn {
    font: inherit; text-align: left; color: var(--ink);
    padding: 0.6rem 0.75rem; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; cursor: pointer;
    display: flex; justify-content: space-between; gap: 0.75rem; align-items: baseline;
  }
  .proj-btn:hover { background: var(--soft); }
  .proj-btn[aria-current="true"] { border-color: var(--accent); background: var(--soft); font-weight: 600; }
  .proj-btn small { color: var(--muted); font-weight: 400; white-space: nowrap; }

  /* Gallery */
  .stage {
    position: relative; aspect-ratio: 16 / 10;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; display: grid; place-items: center;
  }
  .stage img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; display: block; }
  .stage .empty { color: var(--muted); text-align: center; padding: 1rem; max-width: 34ch; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 2.25rem; height: 2.25rem; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 1.1rem; cursor: pointer;
  }
  .nav:hover { background: var(--soft); }
  .nav.prev { left: 0.6rem; } .nav.next { right: 0.6rem; }
  .caption { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.9rem; min-height: 1.4em; }
  .thumbs { display: flex; gap: 0.5rem; margin-top: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; }
  .thumb {
    flex: 0 0 auto; padding: 0; width: 76px; height: 50px;
    border: 2px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb[aria-current="true"] { border-color: var(--accent); }

  .detail h3 { font-size: 1.6rem; font-weight: 700; display: flex; flex-wrap: wrap; gap: 0.4rem 0.75rem; align-items: center; margin-top: 1.25rem; }
  .status {
    font-family: var(--body); font-size: 0.8rem; font-weight: 600; letter-spacing: 0;
    padding: 0.1rem 0.6rem; border-radius: 99px; background: var(--soft); color: var(--accent);
  }
  .status.soon { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
  .detail .sum { margin: 0.5rem 0 0; }
  .detail .stack { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.95rem; }
  .detail ul { margin: 0.75rem 0 0; padding-left: 1.1rem; color: var(--muted); }
  .detail li { margin: 0.3rem 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.1rem; align-items: center; }
  .btn {
    font: inherit; font-weight: 600; font-size: 0.95rem;
    padding: 0.55rem 1rem; border-radius: 6px;
    border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink);
    text-decoration: none; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.quiet { background: transparent; color: var(--accent); }
  .btn.quiet:hover { background: var(--soft); filter: none; }
  .pending { color: var(--muted); font-size: 0.95rem; }

  dialog.lightbox { background: transparent; border: 0; padding: 0; max-width: 96vw; max-height: 96vh; margin: auto; }
  dialog.lightbox::backdrop { background: rgba(0, 0, 0, 0.85); }
  dialog.lightbox img { max-width: 96vw; max-height: 92vh; display: block; border-radius: 6px; cursor: zoom-out; background: var(--surface); }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div>
      <h1>Jay Magayanes</h1>
      <p class="headline">Remote professional in data, support and automation</p>
    </div>
    <div>
      <p class="intro">Seven years of remote experience. Open an area to see what I've built.</p>
      <ul class="contact" id="contact"></ul>
    </div>
  </header>

  <main>
    <div class="mesh" id="mesh"></div>
    <noscript><p>Please enable JavaScript to browse the projects, or email me directly.</p></noscript>
  </main>

  <footer>All projects use sample or public data. None contain information from any employer or client.</footer>
</div>

<dialog class="modal" id="modal" aria-labelledby="m-title">
  <div class="m-head">
    <h2 id="m-title"></h2>
    <button class="x" type="button" id="m-close" aria-label="Close">&times;</button>
  </div>
  <div class="m-body">
    <div class="pane left" id="m-left"></div>
    <div class="pane right" id="m-right"></div>
  </div>
</dialog>

<dialog class="lightbox" id="lightbox" aria-label="Enlarged screenshot">
  <img id="lb-img" alt="">
</dialog>

<script>
/* ============================================================
   EDIT THIS SECTION. Everything below the divider updates itself.
   ============================================================ */
const CONFIG = {
  email: "magayanesjesh@gmail.com",
  linkedin: "",    // e.g. "https://www.linkedin.com/in/your-name"
  upwork: "",      // e.g. "https://www.upwork.com/freelancers/~yourid"
  onlinejobs: "",  // e.g. "https://www.onlinejobs.ph/jobseekers/info/yourid"
  github: "https://github.com/jaymagayanes"
};

/* The tiles on the page. "tag" decides which projects appear inside. */
const ROLES = [
  {
    id: "data", tag: "data", wide: true,
    name: "Data and analytics",
    blurb: "Reporting, data cleaning, quality analysis and dashboards.",
    chips: "Excel, Power Query, SQL, Python, Power BI",
    summary: "I turn messy spreadsheets and operational data into clean, trustworthy reports that teams can act on.",
    strong: "Excel and Power Query, data cleaning and validation, structured reporting, quality auditing",
    working: "SQL, Python, Power BI, data modelling and lineage concepts"
  },
  {
    id: "tech", tag: "tech", wide: true,
    name: "Technical support",
    blurb: "Troubleshooting, integrations, escalations and clear documentation.",
    chips: "Zendesk, Salesforce, Intercom, REST APIs, webhooks",
    summary: "I find the real cause of a problem, not just the symptom, and write it up so the next person can fix it fast.",
    strong: "Troubleshooting, root-cause analysis, escalation reports, documentation, Zendesk, Salesforce, Intercom",
    working: "REST APIs, webhooks, n8n, Python scripting"
  },
  {
    id: "support", tag: "support",
    name: "Customer support",
    blurb: "Chat, email and phone support for large consumer brands.",
    chips: "Zendesk, Salesforce, Intercom",
    summary: "Calm, accurate and consistent with customers across chat, email and phone, with minimal supervision.",
    strong: "Conflict resolution, billing and refunds, order management, escalation handling, remote self-management",
    working: "Zendesk, Salesforce, Intercom, Slack, Zoom, Microsoft Teams"
  },
  {
    id: "ops", tag: "ops",
    name: "Virtual assistance and operations",
    blurb: "Processing, records, reporting and coordination across teams.",
    chips: "Microsoft 365, SharePoint, Slack, WordPress",
    summary: "Organized and detail-focused. I keep records accurate, requests moving and people informed.",
    strong: "Application processing, record keeping, report preparation, coordinating with internal and external teams",
    working: "Microsoft 365, SharePoint, Slack, Zoom, Microsoft Teams, Google Meet, WordPress, Wix"
  },
  {
    id: "web", tag: "web",
    name: "Web development and automation",
    blurb: "Small web tools, scripts and automations that teams use.",
    chips: "JavaScript, Python, Node.js, n8n, Power Automate",
    summary: "I build small, practical tools and automations that replace repetitive manual work, and I'm growing toward full-stack development.",
    strong: "Automation with n8n, Power Automate and Power Query; small web tools",
    working: "JavaScript, HTML and CSS, Python, Node.js and Express, SQL, REST APIs, webhooks"
  }
];

/* tags: data, tech, support, ops, web. A project shows in every tile whose tag it has.
   status: "live" (built) or "soon" (in progress).
   images: screenshots for the gallery. Put the image files in an "images" folder next to index.html.
           Example: { src: "images/zendesk-report-1.png", caption: "Weekly report summary" }
   download: path to a zip in a "downloads" folder, e.g. "downloads/zendesk-report-automation.zip"
   readme: link to the README (GitHub file URL) or a file in your site.
   demo / code: web links. Leave any of these "" to hide the button. */
const PROJECTS = [
  {
    title: "Zendesk report automation",
    status: "live",
    summary: "A Python script that turns raw Zendesk ticket data into a clean report, automatically.",
    details: [
      "Pulls ticket data from the Zendesk API",
      "Groups tickets by status and priority and calculates resolution time",
      "Outputs a CSV report and an HTML digest",
      "Runs on sample data when no credentials are set, so anyone can try it"
    ],
    stack: "Python, REST API, JSON, CSV",
    tags: ["data", "tech", "web"],
    images: [], demo: "", code: "https://github.com/jaymagayanes/Zendesk-Report-Automation", download: "", readme: ""
  },
  {
    title: "8x8 and Zendesk integration simulator",
    status: "live",
    summary: "Simulates how an inbound call becomes a ticket with an agent assigned.",
    details: [
      "An inbound call event triggers ticket creation and agent assignment",
      "Event flow mapped in n8n alongside direct API calls",
      "Shows how two platforms hand data to each other"
    ],
    stack: "n8n, 8x8 API, Zendesk API, JavaScript",
    tags: ["tech", "web"],
    images: [], demo: "", code: "https://github.com/jaymagayanes/8x8-zendeskIntegration", download: "", readme: ""
  },
  {
    title: "Support routing prototype",
    status: "live",
    summary: "An AI-assisted tool that sorts incoming support queries and suggests how to resolve them.",
    details: [
      "Classifies queries by type and urgency",
      "Suggests resolution paths for the agent",
      "Shows how AI output can sit inside a support workflow"
    ],
    stack: "Node.js, Express, JavaScript, webhooks",
    tags: ["support", "tech", "web"],
    images: [], demo: "", code: "https://github.com/jaymagayanes/ai-support-automation-portal", download: "", readme: ""
  },
  {
    title: "Exceptions database web app (sample data)",
    status: "live",
    summary: "A searchable tool that replaces an unstructured exceptions spreadsheet.",
    details: [
      "An M-code pipeline normalizes messy multi-sheet data",
      "A lightweight search page sits on top of the cleaned data",
      "This public version uses made-up records"
    ],
    stack: "Power Query, M-code, JavaScript, HTML",
    tags: ["data", "ops", "web"],
    images: [], demo: "", code: "https://github.com/jaymagayanes/exceptionsDatabase_SearchPortal", download: "", readme: ""
  },
  {
    title: "Support ticket trends dashboard",
    status: "soon",
    summary: "A dashboard on a public customer-support dataset.",
    details: [
      "Ticket volume, resolution time and common issue types"
    ],
    stack: "Power BI or Excel, public dataset",
    tags: ["data", "support"],
    images: [], demo: "", code: "", download: "", readme: ""
  },
  {
    title: "SQL analysis and data model",
    status: "soon",
    summary: "A written analysis on a public dataset with the queries behind it.",
    details: [
      "SQL queries, a simple data model and a lineage diagram"
    ],
    stack: "SQL, data modelling",
    tags: ["data"],
    images: [], demo: "", code: "", download: "", readme: ""
  }
];
/* ============================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Contact row */
$("contact").innerHTML = [
  [CONFIG.email && "mailto:" + CONFIG.email, "Email"],
  [CONFIG.linkedin, "LinkedIn"],
  [CONFIG.upwork, "Upwork"],
  [CONFIG.onlinejobs, "OnlineJobs.ph"],
  [CONFIG.github, "GitHub"]
].filter(e => e[0]).map(e =>
  `<li><a href="${esc(e[0])}"${e[0].startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${e[1]}</a></li>`
).join("");

/* Tiles */
const projectsFor = role => PROJECTS.filter(p => p.tags.includes(role.tag));
$("mesh").innerHTML = ROLES.map(r => {
  const n = projectsFor(r).length;
  return `<button class="tile${r.wide ? " wide" : ""}" type="button" data-role="${r.id}">
    <h2>${esc(r.name)}</h2>
    <p class="blurb">${esc(r.blurb)}</p>
    <p class="chips">${esc(r.chips)}</p>
    <span class="foot"><span>${n} project${n === 1 ? "" : "s"}</span><span class="plus" aria-hidden="true">+</span></span>
  </button>`;
}).join("");

/* Pop-up */
const modal = $("modal"), lightbox = $("lightbox"), lbImg = $("lb-img");
const state = { role: null, projects: [], p: 0, i: 0 };

function renderLeft() {
  const r = state.role;
  $("m-title").textContent = r.name;
  $("m-left").innerHTML = `
    <p class="summary">${esc(r.summary)}</p>
    <dl class="skills">
      <dt>Day-to-day strengths</dt><dd>${esc(r.strong)}</dd>
      <dt>Working knowledge</dt><dd>${esc(r.working)}</dd>
    </dl>
    <h3 class="list-title">Work</h3>
    <div class="proj-list">
      ${state.projects.map((p, k) => `<button type="button" class="proj-btn" data-proj="${k}" aria-current="${k === state.p}">
        <span>${esc(p.title)}</span>${p.status === "soon" ? "<small>In progress</small>" : ""}</button>`).join("")}
    </div>`;
}

function renderRight() {
  const p = state.projects[state.p];
  if (!p) { $("m-right").innerHTML = `<p class="pending">Projects for this area are coming soon.</p>`; return; }
  const imgs = p.images || [];
  const cur = imgs[state.i];
  const stage = imgs.length
    ? `<img src="${esc(cur.src)}" alt="${esc(cur.caption || p.title)}">
       ${imgs.length > 1 ? `<button class="nav prev" type="button" data-nav="-1" aria-label="Previous image">&#8249;</button>
       <button class="nav next" type="button" data-nav="1" aria-label="Next image">&#8250;</button>` : ""}`
    : `<div class="empty">Screenshots coming soon.</div>`;
  const thumbs = imgs.length > 1
    ? `<div class="thumbs">${imgs.map((im, k) => `<button type="button" class="thumb" data-thumb="${k}" aria-current="${k === state.i}" aria-label="Image ${k + 1}"><img src="${esc(im.src)}" alt=""></button>`).join("")}</div>`
    : "";
  const btns = [];
  if (p.download) btns.push(`<a class="btn" href="${esc(p.download)}" download>Download project (.zip)</a>`);
  if (p.readme) btns.push(`<a class="btn quiet" href="${esc(p.readme)}" target="_blank" rel="noopener">Read the README</a>`);
  if (p.demo) btns.push(`<a class="btn quiet" href="${esc(p.demo)}" target="_blank" rel="noopener">Live demo</a>`);
  if (p.code) btns.push(`<a class="btn quiet" href="${esc(p.code)}" target="_blank" rel="noopener">Source on GitHub</a>`);
  if (!btns.length) btns.push(`<span class="pending">Links coming soon</span>`);

  $("m-right").innerHTML = `
    <div class="stage" id="stage">${stage}</div>
    <p class="caption">${imgs.length ? esc(cur.caption || "") : ""}</p>
    ${thumbs}
    <div class="detail">
      <h3>${esc(p.title)} <span class="status${p.status === "soon" ? " soon" : ""}">${p.status === "soon" ? "In progress" : "Built"}</span></h3>
      <p class="sum">${esc(p.summary)}</p>
      <p class="stack">${esc(p.stack)}</p>
      <ul>${p.details.map(d => `<li>${esc(d)}</li>`).join("")}</ul>
      <div class="btns">${btns.join("")}</div>
    </div>`;

  const img = $("stage").querySelector("img");
  if (img) img.addEventListener("error", () => { $("stage").innerHTML = `<div class="empty">This screenshot could not be loaded.</div>`; });
}

function openRole(id) {
  state.role = ROLES.find(r => r.id === id);
  state.projects = projectsFor(state.role);
  state.p = 0; state.i = 0;
  renderLeft(); renderRight();
  document.body.style.overflow = "hidden";
  modal.showModal();
  modal.querySelectorAll(".pane").forEach(el => el.scrollTop = 0);
  modal.querySelector(".m-body").scrollTop = 0;
}

function step(d) {
  const n = (state.projects[state.p].images || []).length;
  if (n < 2) return;
  state.i = (state.i + d + n) % n;
  renderRight();
}

$("mesh").addEventListener("click", e => {
  const t = e.target.closest("[data-role]");
  if (t) openRole(t.dataset.role);
});

modal.addEventListener("click", e => {
  if (e.target === modal) return modal.close();
  const proj = e.target.closest("[data-proj]");
  if (proj) {
    state.p = +proj.dataset.proj; state.i = 0;
    modal.querySelectorAll(".proj-btn").forEach((b, k) => b.setAttribute("aria-current", k === state.p));
    renderRight();
    modal.querySelector(".pane.right").scrollTop = 0;
    return;
  }
  const thumb = e.target.closest("[data-thumb]");
  if (thumb) { state.i = +thumb.dataset.thumb; renderRight(); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav) { step(+nav.dataset.nav); return; }
  if (e.target.matches("#stage img")) {
    lbImg.src = e.target.src; lbImg.alt = e.target.alt; lightbox.showModal();
  }
});

modal.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
modal.addEventListener("close", () => { document.body.style.overflow = ""; });
$("m-close").addEventListener("click", () => modal.close());
lightbox.addEventListener("click", () => lightbox.close());
</script>
</body>
</html>
